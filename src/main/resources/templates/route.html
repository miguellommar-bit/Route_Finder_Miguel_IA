<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Route Finder - Find a route</title>
  <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<h1>Find a route</h1>
<p class="message" th:if="${message}" th:text="${message}"></p>
<form method="post" th:action="@{/route}">
  <label>Origin (airport name or city)</label>
  <input type="text" name="origin" required>
  <label>Destination (airport name or city)</label>
  <input type="text" name="destination" required>
  <button type="submit">Search</button>
</form>
<div th:if="${legs}">
  <h2>Fastest route</h2>
  <ol>
    <li th:each="leg : ${legs}" th:text="${leg}"></li>
  </ol>
  <p>Total travel time: <span th:text="${totalTime}"></span> hours</p>
</div>
<p><a th:href="@{/menu}">Back to menu</a></p>
</body>
</html>
